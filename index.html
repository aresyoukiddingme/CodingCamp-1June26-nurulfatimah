<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header with Theme Toggle -->
        <header class="header">
            <div class="header-left">
                <h1 class="app-title">✨ Dashboard</h1>
            </div>
            <button class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Greeting Section -->
            <section class="greeting-section">
                <div class="greeting-header">
                    <div>
                        <p class="greeting-text"></p>
                        <div class="time-display">
                            <span class="current-time">00:00</span>
                            <span class="current-date">Monday, January 1</span>
                        </div>
                    </div>
                    <div class="user-name-section">
                        <span class="user-name-display">Guest</span>
                        <button class="edit-name-btn" aria-label="Edit name">✏️</button>
                    </div>
                </div>
                <div class="name-edit-modal hidden">
                    <div class="modal-content">
                        <h3>Enter your name</h3>
                        <input type="text" class="name-input" placeholder="Your name" maxlength="30">
                        <div class="modal-buttons">
                            <button class="btn btn-primary" id="save-name-btn">Save</button>
                            <button class="btn btn-secondary" id="cancel-name-btn">Cancel</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Layout: Two Column Grid -->
            <div class="dashboard-grid">
                <!-- Left Column: To-Do List and Focus Timer -->
                <div class="left-column">
                    <!-- To-Do List Section -->
                    <section class="todo-section card">
                        <h2 class="section-title">📋 Today's Tasks</h2>
                        <div class="todo-input-container">
                            <input 
                                type="text" 
                                class="todo-input" 
                                placeholder="Add a new task..."
                                aria-label="Add new task"
                            >
                            <button class="btn btn-add" aria-label="Add task">+</button>
                        </div>
                        <ul class="todo-list"></ul>
                        <p class="empty-state">No tasks yet. Add one to get started! 🚀</p>
                    </section>

                    <!-- Focus Timer Section -->
                    <section class="timer-section card">
                        <h2 class="section-title">⏱️ Focus Timer</h2>
                        <div class="timer-controls">
                            <label for="timer-duration">Duration (minutes):</label>
                            <input 
                                type="number" 
                                id="timer-duration" 
                                class="timer-duration-input" 
                                value="25" 
                                min="1" 
                                max="120"
                            >
                        </div>
                        <div class="timer-display">
                            <span class="timer-time">25:00</span>
                        </div>
                        <div class="timer-buttons">
                            <button class="btn btn-primary" id="start-timer-btn">Start</button>
                            <button class="btn btn-secondary" id="stop-timer-btn">Stop</button>
                            <button class="btn btn-secondary" id="reset-timer-btn">Reset</button>
                        </div>
                    </section>
                </div>

                <!-- Right Column: Quick Links -->
                <div class="right-column">
                    <!-- Quick Links Section -->
                    <section class="links-section card">
                        <h2 class="section-title">🔗 Quick Links</h2>
                        <div class="link-input-container">
                            <input 
                                type="text" 
                                class="link-name-input" 
                                placeholder="Link name (e.g., Gmail)"
                                aria-label="Link name"
                            >
                            <input 
                                type="url" 
                                class="link-url-input" 
                                placeholder="https://example.com"
                                aria-label="Link URL"
                            >
                            <button class="btn btn-add" id="add-link-btn" aria-label="Add link">+</button>
                        </div>
                        <div class="quick-links"></div>
                        <p class="empty-state">No links yet. Add your favorites! 🌐</p>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Modal for Tasks -->
    <div class="task-edit-modal hidden">
        <div class="modal-content">
            <h3>Edit Task</h3>
            <input type="text" class="edit-task-input" placeholder="Task text" maxlength="100">
            <div class="modal-buttons">
                <button class="btn btn-primary" id="save-task-btn">Save</button>
                <button class="btn btn-secondary" id="cancel-task-btn">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal for Links -->
    <div class="link-edit-modal hidden">
        <div class="modal-content">
            <h3>Edit Link</h3>
            <input type="text" class="edit-link-name" placeholder="Link name" maxlength="30">
            <input type="url" class="edit-link-url" placeholder="https://example.com">
            <div class="modal-buttons">
                <button class="btn btn-primary" id="save-link-btn">Save</button>
                <button class="btn btn-secondary" id="cancel-link-btn">Cancel</button>
            </div>
        </div>
    </div>
    <!-- Focus Overlay -->
    <div class="focus-overlay hidden">
        <div class="focus-content">
            <h2>🌌 Focus Session</h2>

            <div class="focus-timer">
                25:00
            </div>

            <button class="btn btn-secondary exit-focus-btn">
                Exit Focus Mode
            </button>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
